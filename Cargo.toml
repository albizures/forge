[workspace]
members = [
    "crates/app",
    "crates/cli",
    "crates/rpc",
    "crates/server",
    "crates/store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/earendil-works/forge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
