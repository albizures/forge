[workspace]
members = [
    "crates/app",
    "crates/build-info",
    "crates/cli",
    "crates/rpc",
    "crates/server",
    "crates/store",
    "crates/forgeup",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/earendil-works/forge"

[workspace.dependencies]
fs2 = "0.4.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
