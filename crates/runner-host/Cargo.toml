[package]
name = "forge-runner-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-app = { path = "../app" }
forge-rpc = { path = "../rpc" }
fs2.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
rustix = { version = "1", features = ["fs", "process", "time"] }

[dev-dependencies]
forge-server = { path = "../server" }
forge-store = { path = "../store" }
rusqlite.workspace = true
tempfile = "3"
# Exercise the existing async daemon inspector with real owned host processes.
# std has no executor/process reactor; reuse Tokio already selected by server.
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "net"] }

[lints]
workspace = true
