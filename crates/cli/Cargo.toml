[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-build-info = { path = "../build-info" }
forgeup = { path = "../forgeup" }
forge-rpc = { path = "../rpc" }
clap = { version = "4.5.53", features = ["derive", "env"] }
jsonrpsee = { version = "0.26.0", features = ["http-client"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
axum = "0.8.8"
forge-app = { path = "../app" }
forge-server = { path = "../server" }
forge-store = { path = "../store" }

[[bin]]
name = "forge"
path = "src/main.rs"

[lints]
workspace = true
