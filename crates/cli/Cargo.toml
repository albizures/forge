[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-build-info = { path = "../build-info" }
forgeup = { path = "../forgeup" }
forge-rpc = { path = "../rpc" }
clap = { version = "4.5.53", features = ["derive", "env"] }
jsonrpsee = { version = "0.26.0", features = ["http-client"] }
hyper = { version = "1", features = ["client", "http1"] }
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dependencies.serde]
version = "1"
[dependencies.serde_json]
version = "1.0.145"
[dependencies.sha2]
version = "0.10.9"

[dependencies.tokio]
version = "1.48.0"
features = ["macros", "net", "rt-multi-thread", "time"]

[dev-dependencies]
tempfile = "3"
axum = "0.8.8"
forge-app = { path = "../app" }
forge-server = { path = "../server" }
forge-store = { path = "../store" }
shlex = "2.0.1"

[[bin]]
name = "forge"
path = "src/main.rs"

[lints]
workspace = true
