<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }}</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; margin: 1rem auto; padding: 0 1rem; max-width: 65rem; overflow-wrap: anywhere; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    :focus-visible { outline: 3px solid #1769aa; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>{{ heading }}</h1><p>{{ message }}</p>
    <nav aria-label="Recovery">
      <a href="{{ retry }}">Try again</a>
      <a href="{{ back }}">Return to Records</a>
      <a href="/records">Choose a Workspace</a>
      <a href="/">Daemon status</a>
    </nav>
  </main>
</body>
</html>
